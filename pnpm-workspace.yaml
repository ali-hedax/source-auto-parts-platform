packages:
  - "apps/*"
  - "packages/*"

# Native/build-script dependencies that are allowed to run install scripts.
onlyBuiltDependencies:
  - "@prisma/engines"
  - "prisma"
  - "argon2"
  - "sharp"
  - "esbuild"
  - "@parcel/watcher"
  - "@tailwindcss/oxide"
  - "unrs-resolver"
  - "@swc/core"
  - "msgpackr-extract"
  - "@embedded-postgres/windows-x64"
  - "@embedded-postgres/linux-x64"

ignoredBuiltDependencies:
  - "@scarf/scarf"

# Security fixes for transitive dependencies (patched release within the same major line).
overrides:
  "body-parser@2.3.0": "2.4.0"
  "mysql2@3.15.3": "3.24.6"
  "fast-uri@3.1.8": "3.1.9"
  "source-map-js@1.2.1": "1.2.2"
  "multer@2.4.0": "2.5.0"
  "vite@8.3.1": "8.3.3"
