name: CI

on:
  pull_request:
  push:
    branches: [main, 'chore/**', 'fix/**', 'feat/**', 'deploy/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build shared packages and API
        run: pnpm --filter @hedax/domain --filter @hedax/contracts --filter @hedax/api run build
      - name: Lint
        run: pnpm lint
      - name: Type checks
        run: pnpm typecheck
      - name: Domain, contracts and API unit tests
        run: pnpm test:unit
      - name: Catalog and import integrity (disposable PostgreSQL)
        run: pnpm --filter @hedax/api exec vitest run --config vitest.integration.config.ts test/integration/85-vehicles.test.ts test/integration/91-unified-parts.test.ts test/integration/93-brand-import-integrity.test.ts test/integration/94-brand-workbooks.test.ts test/integration/95-brand-import-recovery.test.ts
      - name: Visual builder and existing CMS integration tests
        run: pnpm --filter @hedax/api exec vitest run --config vitest.integration.config.ts test/integration/81-site-content.test.ts test/integration/82-visual-builder.test.ts
      - name: Backup and restore drill (disposable PostgreSQL)
        run: pnpm --filter @hedax/api exec vitest run --config vitest.integration.config.ts test/integration/60-backup-restore.test.ts
      - name: Production web build
        run: pnpm --filter @hedax/web build
