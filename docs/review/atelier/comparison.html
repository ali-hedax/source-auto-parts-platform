<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقایسهٔ پیش‌نمایش و اجرای SOURCE</title><style>body{font-family:Tahoma,sans-serif;margin:0;padding:30px;background:#f5f0e8;color:#2a1c16}h1{font-size:24px}p{line-height:1.9}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:40px}figure{margin:0}img{width:100%;border:1px solid #d2c4b1;border-radius:10px}figcaption{padding:12px 0;font-size:14px}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><h1>پیش‌نمایش در کنار اجرای واقعی</h1><p>ستون راست پیش‌نمایش گفتگو و ستون چپ برنامهٔ واقعی با دادهٔ fixture است. محصولات، آمار و فرم‌ها در اجرای واقعی از کامپوننت‌های موجود می‌آیند. قلم عمومی Montserrat است؛ بنر قلم برنامه‌نویسی و تأکیدهای انگلیسی قلم نمونهٔ اولیه را دارند.</p><h2>فروشگاه</h2><div class="pair"><figure><img src="screenshots/preview-home.jpg" alt="پیش‌نمایش فروشگاه"><figcaption>پیش‌نمایش</figcaption></figure><figure><img src="screenshots/implementation-home.jpg" alt="اجرای واقعی فروشگاه با دادهٔ آزمایشی"><figcaption>پیاده‌سازی در مخزن</figcaption></figure></div><h2>پنل مدیریت</h2><div class="pair"><figure><img src="screenshots/preview-admin.jpg" alt="پیش‌نمایش پنل"><figcaption>پیش‌نمایش</figcaption></figure><figure><img src="screenshots/implementation-admin.jpg" alt="پنل واقعی با دادهٔ آزمایشی"><figcaption>پیاده‌سازی با حفظ تمام بخش‌ها و مجوزها</figcaption></figure></div></html>
